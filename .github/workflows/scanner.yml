name: Liverpool News Scanner

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run scanner
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python main.py
      - name: Test Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content":"🔴 TEST: Liverpool News Monitor fungerar!"}' \
          "$DISCORD_WEBHOOK"
      - name: Save database
        run: |
          git config user.name "Liverpool News Bot"
          git config user.email "bot@users.noreply.github.com"

          git add news.db

          git diff --cached --quiet || git commit -m "Update news database"

          git push
